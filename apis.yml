aid: vetsource
name: VetSource
description: 'VetSource is a veterinary technology and pharmacy company founded in 2008 that delivers
  a suite of pharmacy, technology, and business services for the pet health industry. Its offerings
  span home-delivery prescription management (an online pharmacy and prescription workflow that lets
  veterinary practices prescribe and fulfill medications with compliance and revenue tools), the
  Vet2Pet client-engagement platform (a custom-branded app connecting practices with pet owners for
  communication, reminders, loyalty, and telehealth), and data/analytics services that provide industry
  benchmarking and practice performance insights. VetSource serves veterinary practices and pet owners
  across North America. No public developer API, developer portal, or API documentation is published;
  this profile captures the company identity and probed domain-security posture.'
